<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Calendar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calendar">

        <!-- Calendar Header -->
        <div class="header">
            <button id="previous">‹</button>

            <h2 id="monthYear">Loading...</h2>

            <button id="next">›</button>
        </div>

        <!-- Week Names -->
        <div class="weekdays">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
        </div>

        <!-- Calendar Dates -->
        <div id="dates" class="dates"></div>

        <!-- Today's Date -->
        <div class="today">
            <span></span>
            <p id="todayText">Today</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
